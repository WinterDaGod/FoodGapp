name: foodgapp
description: "FoodGApp — an Android meal-planning and nutrition app (school capstone)."
publish_to: 'none'
version: 1.1.8+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Login/accounts (Firebase Authentication, Email/Password) — used ONLY for login.
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6

  # FoodGapp AI for natural language nutrition parsing
  google_generative_ai: ^0.4.7

  # All app data lives on the phone in SQLite (no cross-device sync, by design).
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Recipe/nutrition API calls (Spoonacular primary, TheMealDB backup).
  http: ^1.2.2

  # Internationalization and date formatting.
  intl: ^0.20.3

  # Data visualization for progress and history.
  fl_chart: ^1.2.0

  # Swipable list items for meal management.
  flutter_slidable: ^4.0.3

  # Performance: Image caching and skeleton loading
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0

  # Metadata
  package_info_plus: ^8.3.1
  share_plus: ^10.1.0

  # New Production Features
  image_picker: ^1.1.2
  mobile_scanner: ^5.1.1
  health: ^13.3.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Icon generation tool
  flutter_launcher_icons: ^0.14.4

  # Runs sqflite in the Dart VM (in-memory) so the data layer can be unit-tested.
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon_v2.png"
  # Match the background of the logo to avoid "weird" rings on Android 12+
  adaptive_icon_background: "#1E1E1E" 
  adaptive_icon_foreground: "assets/app_icon_v2.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/data/food_library_titan.db
    - assets/data/food_library.json
    - assets/data/ph_market_prices.json
