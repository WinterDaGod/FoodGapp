name: iOS Cloud Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Create Config Files from Secrets
        run: |
          mkdir -p lib/config
          cat << 'EOF' > lib/firebase_options.dart
          ${{ secrets.FIREBASE_OPTIONS }}
          EOF
          cat << 'EOF' > lib/config/api_config.dart
          ${{ secrets.API_CONFIG }}
          EOF
          
      - name: Precache iOS
        run: flutter precache --ios
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build iOS (No Codesign)
        # Using Swift Package Manager (SPM) and bypassing code signing for CI.
        # Fixed obfuscation flags to use standard Flutter syntax.
        run: |
          rm -rf ios/Podfile ios/Podfile.lock ios/Pods
          flutter build ios --release --no-codesign \
            --build-name=1.1.6 --build-number=1 \
            --obfuscate --split-debug-info=build/ios/symbols
        
      - name: Package IPA
        run: |
          # Package the .app into a standard IPA structure
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -vr FoodGapp.ipa Payload
          mv FoodGapp.ipa ../../../
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodGapp-iOS-IPA
          path: FoodGapp.ipa
          if-no-files-found: error
          retention-days: 7
