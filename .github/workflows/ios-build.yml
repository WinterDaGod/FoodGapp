name: iOS Cloud Build

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Precache iOS
        run: flutter precache --ios
          
      - name: Get Dependencies
        run: flutter pub get
        
      - name: Build iOS (No Codesign)
        # We migrate to Swift Package Manager (SPM) by ensuring Podfile is absent.
        # This resolves the 'podhelper.rb' error found on Windows.
        # Explicitly disabling code signing requirements for the CI environment.
        run: |
          rm -rf ios/Podfile ios/Podfile.lock ios/Pods
          flutter build ios --release --no-codesign --build-name=1.1.6 --build-number=1 --extra-gen-snapshot-options=--obfuscate --extra-gen-snapshot-options=--split-debug-info=build/app/outputs/symbols
        
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r FoodGapp.ipa Payload
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodGapp-iOS-IPA
          path: FoodGapp.ipa
          if-no-files-found: error
          retention-days: 7
